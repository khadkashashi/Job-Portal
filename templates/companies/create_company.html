{% extends "base.html" %}

{% block title %}Create Company{% endblock %}

{% block content %}

<div class="container py-5">

<div class="custom-card">

    <div class="d-flex align-items-center mb-3">

        <i class="bi bi-building-add text-primary" style="font-size: 32px;"></i>

        <h2 class="mb-0 ms-3">Create Company</h2>

    </div>

    <hr>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="mb-3">

            <label class="form-label fw-bold">
                <i class="bi bi-credit-card text-muted me-1"></i>
                Do you want to purchase a paid plan now?
            </label>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="wants_paid_plan" value="yes" id="planYes">
                <label class="form-check-label" for="planYes">
                    Yes, take me to choose a plan
                </label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="wants_paid_plan" value="no" id="planNo" checked>
                <label class="form-check-label" for="planNo">
                    No, start on the Free plan (10 job posts limit)
                </label>
            </div>

        </div>

        <button class="btn btn-primary-custom">
            <i class="bi bi-check-circle"></i> Create Company
        </button>

    </form>

</div>

</div>

{% endblock %}
