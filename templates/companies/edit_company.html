{% extends "base.html" %}

{% block title %}Edit Company{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="custom-card">

        <h2>Edit Company</h2>

        <hr>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn btn-primary-custom">

                Save Changes

            </button>

        </form>

    </div>

</div>

{% endblock %}
