{% extends "base.html" %}

{% block title %}Check Your Email{% endblock %}

{% block content %}

<section class="auth-section">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-5">

<div class="auth-card text-center">

<i class="bi bi-envelope-check text-primary" style="font-size: 50px;"></i>

<h2 class="auth-title mt-3 mb-2">
Check Your Email
</h2>

<p class="text-muted mb-4">
If an account exists with that email, we've sent a link to reset your password.
</p>

<a href="{% url 'login' %}" class="btn-primary-custom d-inline-block">
Back to Login
</a>

</div>

</div>

</div>

</div>

</section>

{% endblock %}
