{% extends "base.html" %}

{% block title %}Apply Job{% endblock %}

{% block content %}

<div class="container py-5">

<div class="col-lg-8 mx-auto">

<div class="custom-card">

<h2 class="mb-4">

Apply for

<strong>

{{ job.title }}

</strong>

</h2>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

{{ form.as_p }}

<button class="btn btn-primary-custom">

Submit Application

</button>

</form>

</div>

</div>

</div>

{% endblock %}
